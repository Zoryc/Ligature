# Ligature behind nginx: save as /etc/nginx/sites-available/ligature with latex.example.org replaced by your
# host name (the same as LIGATURE_ORIGIN, without https://). docker/README.md step 5 has the commands:
# get the certificate with `certbot certonly --nginx` (certonly: plain `--nginx` would install it into a copy
# of your default site, which then takes over this host name), enable the site, `nginx -t`, reload.
# Your other sites are untouched. nginx in Docker: proxy_pass to the app container instead (step 5). Requirements of Ligature for any proxy: pass WebSocket upgrades (/collab),
# keep the Host header, allow large uploads and long requests, and overwrite X-Forwarded-For with the client's
# address (LIGATURE_TRUST_PROXY=1 trusts its first value for login rate limits).

# Connection header for WebSocket upgrades (own name, so it cannot clash with a `map` of another site).
map $http_upgrade $ligature_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name latex.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 is optional (the editor's live connection is a WebSocket over HTTP/1.1). To turn it on: nginx
    # 1.25.1+ `http2 on;`, older nginx (Ubuntu 24.04 ships 1.24) `listen 443 ssl http2;` instead.
    server_name latex.example.org;

    ssl_certificate     /etc/letsencrypt/live/latex.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/latex.example.org/privkey.pem;

    # Large uploads (images, zip import).
    client_max_body_size 200m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # Must match LIGATURE_PORT in docker/.env (default 3000).
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ligature_connection_upgrade;
        # Long compiles, and idle WebSockets between edits.
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }
}
